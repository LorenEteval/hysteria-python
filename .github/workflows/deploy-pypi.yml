name: Deploy PyPI

on: [push, pull_request]

jobs:
  build-wheels:
    name: Wheels (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            arch: x86_64
            macos-target: ""
          - platform: linux
            os: ubuntu-24.04-arm
            arch: aarch64
            macos-target: ""
          - platform: windows
            os: windows-2022
            arch: AMD64
            macos-target: ""
          - platform: windows
            os: windows-11-arm
            arch: ARM64
            macos-target: ""
          - platform: macos
            os: macos-15-intel
            arch: x86_64
            macos-target: "10.13"
          - platform: macos
            os: macos-15
            arch: arm64
            macos-target: "11.0"
    steps:
      - uses: actions/checkout@v4

      # Linux builds run in manylinux containers. Go is installed there by
      # tool.cibuildwheel.linux.before-all in pyproject.toml.
      - uses: actions/setup-go@v5
        if: matrix.platform != 'linux'
        with:
          go-version: "1.20.14"
          check-latest: false
          cache-dependency-path: |
            hysteria-go/go.work.sum
            hysteria-go/app/go.sum
            hysteria-go/core/go.sum

      - uses: egor-tensin/setup-mingw@v3
        if: matrix.platform == 'windows' && matrix.arch == 'AMD64'
        with:
          platform: x64

      # GCC does not target Windows ARM64. Use an ARM-native LLVM-MinGW
      # distribution so Go/cgo and CMake produce compatible ARM64 objects.
      - name: Install LLVM-MinGW for Windows ARM64
        if: matrix.platform == 'windows' && matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          $archiveName = 'llvm-mingw-20260616-ucrt-aarch64.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $destinationPath = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/$archiveName"
          $expectedSha256 = '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba'

          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
              throw "LLVM-MinGW checksum mismatch: $actualSha256"
          }

          Expand-Archive -Path $archivePath -DestinationPath $destinationPath
          $toolchainBin = Get-ChildItem -Path $destinationPath -Filter gcc.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $toolchainBin) {
              throw 'LLVM-MinGW bin directory was not found'
          }

          $gcc = Join-Path $toolchainBin 'gcc.exe'
          $target = (& $gcc -dumpmachine).Trim()
          if ($target -ne 'aarch64-w64-windows-gnu') {
              throw "Unexpected LLVM-MinGW target: $target"
          }

          $goArch = (& go env GOARCH).Trim()
          if ($goArch -ne 'arm64') {
              throw "Unexpected Go architecture: $goArch"
          }

          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=g++' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native build tools
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          go version
          cmake --version
          c++ --version

      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}

      - name: Store wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: true
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - name: Store source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  store:
    name: Collect and validate distributions
    runs-on: ubuntu-24.04
    needs: [build-wheels, build-sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Validate distribution tags and metadata
        shell: python
        run: |
          import email
          import pathlib
          import zipfile

          dist = pathlib.Path("dist")
          sdists = list(dist.glob("*.tar.gz"))
          wheels = list(dist.glob("*.whl"))
          assert len(sdists) == 1, sdists
          assert wheels, "no wheels were collected"
          for wheel in wheels:
              assert not wheel.name.endswith("-none-any.whl"), wheel.name
              with zipfile.ZipFile(wheel) as archive:
                  wheel_metadata = next(
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/WHEEL")
                  )
                  metadata = email.message_from_bytes(archive.read(wheel_metadata))
              assert metadata["Root-Is-Purelib"] == "false", wheel.name
              tags = metadata.get_all("Tag", [])
              assert tags and all(not tag.endswith("-any") for tag in tags), (
                  wheel.name, tags
              )
              print(f"{wheel.name}: {', '.join(tags)}")
      - name: Store all distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish-to-pypi:
    name: Publish Python distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [store]
    runs-on: ubuntu-latest
    environment:
      name: deploy-pypi
      url: https://pypi.org/p/hysteria
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --notes ""
      - name: Upload distributions to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
