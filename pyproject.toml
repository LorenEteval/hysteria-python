[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp3{8,9,10,11,12,13,14,14t}-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-sources = ["sample"]
test-command = "python sample/sample.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "dnf install -y curl",
    "curl -fsSL https://go.dev/dl/go1.20.14.linux-amd64.tar.gz -o /tmp/go1.20.14.linux-amd64.tar.gz",
    "echo 'ff445e48af27f93f66bd949ae060d97991c83e11289009d311f25426258f9c44  /tmp/go1.20.14.linux-amd64.tar.gz' | sha256sum -c -",
    "rm -rf /usr/local/go",
    "tar -C /usr/local -xzf /tmp/go1.20.14.linux-amd64.tar.gz",
    "ln -sf /usr/local/go/bin/go /usr/local/bin/go",
    "/usr/local/bin/go version",
    "gcc --version",
]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
