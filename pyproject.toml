[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# cibuildwheel 4 no longer supports CPython 3.8 or 3.13t; the workflow builds
# those compatibility wheels separately with cibuildwheel 3.4.1.
build = "cp3{9,10,11,12,13,14,14t}-*"
# cibuildwheel does not provide a CPython 3.8 build for Windows ARM64.
skip = "*-musllinux_* cp38-win_arm64"
test-sources = ["sample"]
test-command = "python sample/sample.py"

[tool.cibuildwheel.linux]
before-all = """
dnf install -y curl
case "$(uname -m)" in
    x86_64)
        go_arch='amd64'
        go_sha256='ff445e48af27f93f66bd949ae060d97991c83e11289009d311f25426258f9c44'
        ;;
    aarch64|arm64)
        go_arch='arm64'
        go_sha256='2096507509a98782850d1f0669786c09727053e9fe3c92b03c0d96f48700282b'
        ;;
    *)
        echo "Unsupported Linux architecture: $(uname -m)" >&2
        exit 1
        ;;
esac
go_archive="/tmp/go1.20.14.linux-${go_arch}.tar.gz"
curl -fsSLo "${go_archive}" "https://go.dev/dl/go1.20.14.linux-${go_arch}.tar.gz"
echo "${go_sha256}  ${go_archive}" | sha256sum -c -
rm -rf /usr/local/go
tar -C /usr/local -xzf "${go_archive}"
/usr/local/go/bin/go version
gcc --version
"""
environment = { PATH = "/usr/local/go/bin:$PATH" }

[tool.cibuildwheel.macos.environment]
# cibuildwheel raises this to each interpreter/architecture's minimum (11.0
# for Apple Silicon), preserving the existing deployment targets.
MACOSX_DEPLOYMENT_TARGET = "10.13"
